- title: "The Lips, the Teeth, the tip of the Tongue: LTT Tracking"
  authors: ["Feisal Rasras", "Stanislav Pidhorskyi", "Tomas Simon", "Hallison Paz", "Hongsheng Wen", "Jason Saragih", "Javier Romero"]
  me: "Hallison Paz"
  venue: "SIGGRAPH Asia 2024"
  date: 2024-12-03
  abstract: "A mesh-based generative model of the inner-mouth system is presented, which includes teeth and gums for the upper and lower jaw, the tongue, and their placement inside the human head. The model is capable of capturing person-specific detail, enabling the creation of highly accurate avatars that exceed the quality of prior mesh-based representations."
  image: "/static/images/pubs/ltt-tracking.png"
  links:
    project: "https://sa2024.siggraph.org"
    paper: "https://dl.acm.org/doi/pdf/10.1145/3680528.3687691"
    bibtex: |
      @inproceedings{10.1145/3680528.3687691,
      author = {Rasras, Feisal and Pidhorskyi, Stanislav and Simon, Tomas and Paz, Hallison and Wen, He and Saragih, Jason and Romero, Javier},
      title = {The Lips, the Teeth, the tip of the Tongue: LTT Tracking},
      year = {2024},
      isbn = {9798400711312},
      publisher = {Association for Computing Machinery},
      address = {New York, NY, USA},
      url = {https://doi.org/10.1145/3680528.3687691},
      doi = {10.1145/3680528.3687691},
      abstract = {A mesh-based generative model of the inner-mouth system is presented, which includes teeth and gums for the upper and lower jaw, the tongue, and their placement inside the human head. The model is capable of capturing person-specific detail, enabling the creation of highly accurate avatars that exceed the quality of prior mesh-based representations. The method combines data from oral scans and facial performances captured in a multi-camera capture rig. The system employs a precise segmentation model that can differentiate complex tongue motion. A novel inverse-rendering formulation is used in a staged modeling procedure, producing accurate registration of tongue, teeth, and jaw. The system is demonstrated on novel held-out subjects, where we demonstrate highly accurate reconstructions that exceed prior mesh-based avatar representations.},
      booktitle = {SIGGRAPH Asia 2024 Conference Papers},
      articleno = {115},
      numpages = {11},
      keywords = {Facial Tracking, Tongue Model, Universal Teeth Model, Jaw Skinning, Head Stabilization.},
      location = {Tokyo, Japan},
      series = {SA '24}
      }

- title: "Spectral Periodic Networks for Neural Rendering"
  authors: ["Hallison Paz", "Tiago Novello", "Luiz Velho"]
  me: "Hallison Paz"
  venue: "ACM SIGGRAPH Posters 2024"
  date: 2024-07-28
  abstract: "We present an implicit neural representation to describe periodic signals in neural rendering. We encode attribute functions through a periodic neural network $f: \\mathbb{R}^n \\rightarrow A$, where $A$ is the attribute space. We explore two important cases in neural rendering: (a) the representation of seamless tileable texture materials and (b) the visualization of 360° spherical panoramas."
  image: "/static/images/pubs/leopard-texture.gif"
  links:
    project: "https://dl.acm.org/doi/fullHtml/10.1145/3641234.3671087"
