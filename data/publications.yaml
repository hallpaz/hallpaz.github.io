- title: "Neural networks for implicit representations of 3D scenes"
  authors: ["Luiz Schirmer", "Guilherme Schardong", "Vinícius da Silva", "Hélio Lopes", "Tiago Novello", "Daniel Yukimura", "Hallison Paz", "Luiz Velho"]
  me: "Hallison Paz"
  venue: "SIBGRAPI 2021"
  date: 2021-10-18
  abstract: "This tutorial presents methods that use neural networks for implicit representations of 3D geometry (neural implicit functions). We explore the different aspects of neural implicit functions for shape modeling and synthesis. We aim to provide a theoretical analysis of 3D shape reconstruction using deep neural networks and introduce a discussion between researchers interested in this research field."
  image: null
  links:
    project: "https://lvelho.impa.br/ni3d-2021/"
