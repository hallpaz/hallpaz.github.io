- title: "Neural implicit morphing of face images"
  authors: ["Guilherme Schardong", "Tiago Novello", "Hallison Paz", "Iurii Medvedev", "Vinícius da Silva", "Luiz Velho", "Nuno Gonçalves"]
  me: "Hallison Paz"
  venue: "CVPR 2024"
  date: 2024-06-17
  badge: "LatinX Best Paper Award"
  abstract: "We investigate the use of smooth neural networks for morphing face images regularized by thin-plate energy. For this, we model time as a parameter and disentangle information from blending."
  image: "/static/images/pubs/lecunnton.gif"
  links:
