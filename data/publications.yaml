- title: "MR-Net: Multiresolution sinusoidal neural networks"
  authors: ["Hallison Paz", "Daniel Perazzo", "Tiago Novello", "Guilherme Schardong", "Luiz Schirmer", "Vinícius da Silva", "Daniel Yukimura", "Fabio Chagas", "Hélio Lopes", "Luiz Velho"]
  me: "Hallison Paz"
  venue: "Computers & Graphics 2023"
  date: 2023-05-18
  abstract: "We extend sinusoidal networks, and we build an infrastructure to train networks to represent signals in multiresolution. Our coordinate-based networks, namely L-Net, M-Net, and S-Net, are continuous both in space and in scale as they are composed of multiple stages that progressively add finer details. Our experiments show that MR-Net can reach comparable Peak Signal-to-Noise Ratio (PSNR) to other architectures, on image reconstruction, while needing fewer additional parameters for multiresolution."
  image: "/static/images/pubs/mrnet-masp.gif"
  links:
    code: "https://github.com/visgraf/mrnet"
    project: "https://visgraf.impa.br/mrnet"
    bibtex: |
      @article{paz2023mrnet,
        title={MR-Net: Multiresolution sinusoidal neural networks},
        author={Paz, Hallison and Perazzo, Daniel and Novello, Tiago and Schardong, Guilherme and Schirmer, Luiz and da Silva, Vin{\'\i}cius and Yukimura, Daniel and Chagas, Fabio and Lopes, H{\'e}lio and Velho, Luiz},
        journal={Computers \& Graphics},
        volume={114},
        pages={387--400},
        year={2023},
        publisher={Elsevier}
      }


- title: "Multiresolution neural networks for imaging"
  authors: ["Hallison Paz", "Tiago Novello", "Vinícius da Silva", "Guilherme Schardong", "Luiz Schirmer", "Fabio Chagas", "Hélio Lopes", "Luiz Velho"]
  me: "Hallison Paz"
  venue: "SIBGRAPI 2022"
  date: 2022-10-24
  abstract: "MR-Net is a general architecture for multiresolution neural networks, and a framework for imaging applications. Our coordinate-based networks are continuous both in space and in scale as they are composed of multiple stages that progressively add finer details."
  image: "/static/images/pubs/mr-woven.png"
